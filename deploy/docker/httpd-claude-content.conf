# TLS vhost example: reverse_proxy → Node API on 8787 + static dist
# Long blog runs use POST /api/run/stream (SSE). Default ProxyTimeout (300s) or ~900s upstream limits kill runs.
<VirtualHost *:8443>
    ServerName claude-content.example.com

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/claude-content.crt
    SSLCertificateKeyFile /etc/pki/tls/private/claude-content.key

    DocumentRoot /var/www/vhosts/claude-content-UI/dist

    <Directory /var/www/vhosts/claude-content-UI/dist>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # WebSocket PTY (must be before generic /api)
    ProxyPass        /api/terminal/ws ws://127.0.0.1:8787/api/terminal/ws
    ProxyPassReverse /api/terminal/ws ws://127.0.0.1:8787/api/terminal/ws

    ProxyPass        /api http://127.0.0.1:8787/api
    ProxyPassReverse /api http://127.0.0.1:8787/api

    ProxyTimeout 3600
    Timeout 3600

    ErrorLog /var/www/vhosts/logs/httpd-error.log
    CustomLog /var/www/vhosts/logs/httpd-access.log combined
</VirtualHost>

# nginx equivalent (location block for /api/run/stream or all /api):
#   proxy_read_timeout 3600s;
#   proxy_send_timeout 3600s;
#   proxy_buffering off;
